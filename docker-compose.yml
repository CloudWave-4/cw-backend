version: '3.8'

services:
    mysql:
      image: mysql:8.0
      container_name: cloudwave-mysql
      environment:
        MYSQL_ROOT_PASSWORD: root1234
        MYSQL_DATABASE: cloudwave
      ports:
        - "3306:3306"
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5

    backend:
      image: ${ECR_IMAGE_URI:-cloudwave-backend:latest}
      container_name: cloudwave-backend
      environment:
        DB_URL: mysql
        DB_NAME: cloudwave
        DB_USERNAME: root
        DB_PW: root1234
      ports:
        - "8080:8080"
      depends_on:
        mysql:
          condition: service_healthy
# 공통 환경
spring:
  application:
    name: CloudWave-Backend
  profiles:
    active: prod # default dev mode
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: waiting-group
      auto-offset-reset: earliest
  jpa:
    hibernate:
      ddl-auto: create
    database: mysql
    properties:
      hibernate:
        format_sql: true
# 조건부 로딩
app:
  kafka:
    enabled: true
  redis:
    enabled: true
---
# Dev 환경
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${LOCAL_DB_URL}:3306/${LOCAL_DB_NAME}?serverTimezone=Asia/Seoul
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PW}
  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: ${LOCAL_REDIS_PORT}
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_SERVERS}
    msk:
      enabled: false

---
# prod 환경
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDS_URL}:3306/${RDS_NAME}?serverTimezone=Asia/Seoul
    username: ${RDS_USERNAME}
    password: ${RDS_PW}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 0
      connection-timeout: 30000
      max-lifetime: 1500000
      idle-timeout: 600000

  data:
    redis:
      host: ${ELASTICACHE_HOST}
      port: ${ELASTICACHE_PORT}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  kafka:
    bootstrap-servers: ${MSK_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler